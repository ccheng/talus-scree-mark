name: M3 desktop acceptance

on:
  pull_request:
    branches: [main]
    paths:
      - 'app/**'
      - 'scripts/**'
      - 'tests/**'
      - 'package.json'
      - '.github/workflows/m3-acceptance.yml'

permissions:
  contents: read

jobs:
  desktop-chromium:
    runs-on: ubuntu-24.04
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: npm run check:release
      - name: Verify frozen M2 compatibility inputs
        run: node tests/acceptance/m3/frozen-reference.mjs app
      - name: Generate independently labeled markerless sheets
        run: |
          python -m pip install Pillow==11.3.0
          python tests/acceptance/m3/fixtures.py
          python tests/acceptance/m3/pose-fixtures.py
          python tests/acceptance/m3/interleaved-crop-fixtures.py
          python tests/acceptance/m3/alberta-fixtures.py
          python tests/acceptance/m3/alberta-photo-fixtures.py
          if ! command -v pdftoppm; then
            sudo apt-get update
            sudo apt-get install -y poppler-utils
          fi
          pdftoppm -f 1 -l 1 -r 180 -png -singlefile app/fixtures/m3/mc-only-filled.pdf tests/acceptance/m3/fixtures/cross-renderer-filled
      - name: Prepare desktop Chromium
        run: |
          npm install --prefix "$RUNNER_TEMP/talus-browser" --no-save --package-lock=false playwright@1.58.2
          "$RUNNER_TEMP/talus-browser/node_modules/.bin/playwright" install --with-deps chromium
      - name: Run independent M3 browser acceptance
        env:
          TALUS_TEST_PLAYWRIGHT_PATH: ${{ runner.temp }}/talus-browser/node_modules/playwright/index.mjs
        run: node tests/acceptance/m3/browser.mjs "$GITHUB_WORKSPACE/app"
